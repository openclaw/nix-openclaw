name: Pin Stable OpenClaw Version

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: pin-stable-openclaw-version
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      has_update: ${{ steps.select.outputs.has_update }}
      source_tag: ${{ steps.select.outputs.source_tag }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      source_version: ${{ steps.select.outputs.source_version }}
      app_tag: ${{ steps.select.outputs.app_tag }}
      app_url: ${{ steps.select.outputs.app_url }}
      app_version: ${{ steps.select.outputs.app_version }}
      latest_stable_tag: ${{ steps.select.outputs.latest_stable_tag }}
      app_lag_releases: ${{ steps.select.outputs.app_lag_releases }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select release
        id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selection="$(scripts/update-pins.sh select)"

          while IFS='=' read -r key value; do
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          done <<<"$selection"

          has_update="$(printf '%s\n' "$selection" | awk -F= '$1 == "has_update" { print $2; exit }')"
          source_tag="$(printf '%s\n' "$selection" | awk -F= '$1 == "source_tag" { print $2; exit }')"
          app_tag="$(printf '%s\n' "$selection" | awk -F= '$1 == "app_tag" { print $2; exit }')"
          latest_stable_tag="$(printf '%s\n' "$selection" | awk -F= '$1 == "latest_stable_tag" { print $2; exit }')"
          app_lag_releases="$(printf '%s\n' "$selection" | awk -F= '$1 == "app_lag_releases" { print $2; exit }')"

          {
            echo "### OpenClaw release selection"
            echo
            echo "- Latest stable upstream release: \`${latest_stable_tag:-unknown}\`"
            echo "- Selected source release: \`${source_tag:-unknown}\`"
            echo "- Selected macOS app artifact: \`${app_tag:-preserve-current}\`"
            echo "- Update needed: \`${has_update:-unknown}\`"
            if [[ -n "${app_lag_releases:-}" ]]; then
              echo "- macOS app asset lagging source release(s): \`${app_lag_releases}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  validate-linux:
    needs: select
    if: needs.select.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      materialization_digest: ${{ steps.materialization.outputs.materialization_digest }}
      validation_ok: ${{ steps.validation.outputs.validation_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Materialize selected release
        id: materialize
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/update-pins.sh apply \
            "${{ needs.select.outputs.source_tag }}" \
            "${{ needs.select.outputs.source_sha }}" \
            "${{ needs.select.outputs.app_tag }}" \
            "${{ needs.select.outputs.app_url }}"

      - name: Record materialized diff digest
        id: materialization
        if: steps.materialize.outcome == 'success'
        run: |
          set -euo pipefail
          pin_files=()
          while IFS= read -r file; do
            pin_files+=("$file")
          done < <(scripts/update-pins.sh files)
          git add --intent-to-add -- "${pin_files[@]}"
          digest="$(
            git diff --binary -- "${pin_files[@]}" \
              | shasum -a 256 \
              | awk '{ print $1 }'
          )"
          echo "materialization_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Verify flake.lock owners
        id: owners
        if: steps.materialize.outcome == 'success' && steps.materialization.outcome == 'success'
        continue-on-error: true
        run: scripts/check-flake-lock-owners.sh

      - name: Validate Linux supported surface
        id: supported_surface
        if: steps.materialize.outcome == 'success' && steps.materialization.outcome == 'success' && steps.owners.outcome == 'success'
        continue-on-error: true
        run: |
          timeout --foreground 50m maintainers/scripts/ci-nix-build.sh linux-supported-surface \
            .#checks.x86_64-linux.package-artifacts \
            .#checks.x86_64-linux.module-render \
            .#checks.x86_64-linux.runtime-smoke \
            .#checks.x86_64-linux.platform-activation \
            .#checks.x86_64-linux.runtime-plugin-packages \
            .#checks.x86_64-linux.runtime-plugin-host \
            .#checks.x86_64-linux.qmd-opt-in \
            --accept-flake-config

      - name: Summarize Linux HM activation timing
        if: steps.supported_surface.outcome == 'success'
        run: maintainers/scripts/summarize-hm-activation-timing.sh x86_64-linux linux-supported-surface

      - name: Record validation result
        id: validation
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.materialize.outcome }}" == "success" && "${{ steps.owners.outcome }}" == "success" && "${{ steps.supported_surface.outcome }}" == "success" ]]; then
            echo "validation_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "validation_ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Linux validation did not pass"
            echo
            echo "- Materialize: \`${{ steps.materialize.outcome }}\`"
            echo "- Materialized diff digest: \`${{ steps.materialization.outcome }}\`"
            echo "- flake.lock owners: \`${{ steps.owners.outcome }}\`"
            echo "- Supported surface: \`${{ steps.supported_surface.outcome }}\`"
            echo
            echo "Promotion skipped; pinned source remains unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  validate-macos:
    needs: select
    if: needs.select.outputs.has_update == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      materialization_digest: ${{ steps.materialization.outputs.materialization_digest }}
      validation_ok: ${{ steps.validation.outputs.validation_ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Materialize selected release
        id: materialize
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/update-pins.sh apply \
            "${{ needs.select.outputs.source_tag }}" \
            "${{ needs.select.outputs.source_sha }}" \
            "${{ needs.select.outputs.app_tag }}" \
            "${{ needs.select.outputs.app_url }}"

      - name: Record materialized diff digest
        id: materialization
        if: steps.materialize.outcome == 'success'
        run: |
          set -euo pipefail
          pin_files=()
          while IFS= read -r file; do
            pin_files+=("$file")
          done < <(scripts/update-pins.sh files)
          git add --intent-to-add -- "${pin_files[@]}"
          digest="$(
            git diff --binary -- "${pin_files[@]}" \
              | shasum -a 256 \
              | awk '{ print $1 }'
          )"
          echo "materialization_digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Validate macOS supported surface
        id: supported_surface
        if: steps.materialize.outcome == 'success' && steps.materialization.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          maintainers/scripts/ci-nix-build.sh macos-supported-surface \
            --accept-flake-config \
            --option max-jobs 2 \
            .#checks.aarch64-darwin.package-artifacts \
            .#checks.aarch64-darwin.module-render \
            .#checks.aarch64-darwin.runtime-smoke \
            .#checks.aarch64-darwin.platform-activation \
            .#checks.aarch64-darwin.runtime-plugin-packages \
            .#checks.aarch64-darwin.runtime-plugin-host \
            .#checks.aarch64-darwin.qmd-opt-in

      - name: Run HM activation
        id: hm
        if: steps.materialize.outcome == 'success' && steps.materialization.outcome == 'success' && steps.supported_surface.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        run: |
          nix build \
            --accept-flake-config \
            --option max-jobs 2 \
            --out-link result-platform-activation \
            .#checks.aarch64-darwin.platform-activation
          OPENCLAW_HM_ACTIVATION_PACKAGE="$PWD/result-platform-activation" scripts/hm-activation-macos.sh

      - name: Record validation result
        id: validation
        if: always()
        run: |
          set -euo pipefail
          if [[ "${{ steps.materialize.outcome }}" == "success" && "${{ steps.supported_surface.outcome }}" == "success" && "${{ steps.hm.outcome }}" == "success" ]]; then
            echo "validation_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "validation_ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "### macOS validation did not pass"
            echo
            echo "- Materialize: \`${{ steps.materialize.outcome }}\`"
            echo "- Materialized diff digest: \`${{ steps.materialization.outcome }}\`"
            echo "- Supported surface: \`${{ steps.supported_surface.outcome }}\`"
            echo "- HM activation: \`${{ steps.hm.outcome }}\`"
            echo
            echo "Promotion skipped; pinned source remains unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  verify-materialization:
    needs:
      - select
      - validate-linux
      - validate-macos
    if: >-
      ${{
        needs.select.outputs.has_update == 'true' &&
        needs.validate-linux.outputs.validation_ok == 'true' &&
        needs.validate-macos.outputs.validation_ok == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      materialization_digest: ${{ steps.verify.outputs.materialization_digest }}
    steps:
      - name: Verify cross-platform materialization
        id: verify
        env:
          LINUX_MATERIALIZATION_DIGEST: ${{ needs.validate-linux.outputs.materialization_digest }}
          MACOS_MATERIALIZATION_DIGEST: ${{ needs.validate-macos.outputs.materialization_digest }}
        run: |
          set -euo pipefail
          if [[ -z "$LINUX_MATERIALIZATION_DIGEST" || -z "$MACOS_MATERIALIZATION_DIGEST" ]]; then
            echo "Missing validation materialization digest." >&2
            exit 1
          fi
          if [[ "$LINUX_MATERIALIZATION_DIGEST" != "$MACOS_MATERIALIZATION_DIGEST" ]]; then
            echo "Linux and macOS materialized different release diffs." >&2
            echo "Linux: $LINUX_MATERIALIZATION_DIGEST" >&2
            echo "macOS: $MACOS_MATERIALIZATION_DIGEST" >&2
            exit 1
          fi
          echo "materialization_digest=$LINUX_MATERIALIZATION_DIGEST" >> "$GITHUB_OUTPUT"

  promote:
    needs:
      - select
      - verify-materialization
    if: >-
      ${{
        github.ref == 'refs/heads/main' &&
        needs.select.outputs.has_update == 'true'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1

      - name: Promote selected release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_MATERIALIZATION_DIGEST: ${{ needs.verify-materialization.outputs.materialization_digest }}
        run: |
          set -euo pipefail
          git config user.name "openclaw-ci"
          git config user.email "ci@openclaw.local"

          scripts/update-pins.sh apply \
            "${{ needs.select.outputs.source_tag }}" \
            "${{ needs.select.outputs.source_sha }}" \
            "${{ needs.select.outputs.app_tag }}" \
            "${{ needs.select.outputs.app_url }}"

          pin_files=()
          while IFS= read -r file; do
            pin_files+=("$file")
          done < <(scripts/update-pins.sh files)
          git add --intent-to-add -- "${pin_files[@]}"

          if git diff --quiet -- "${pin_files[@]}"; then
            echo "No pin changes detected."
            exit 0
          fi

          promote_digest="$(
            git diff --binary -- "${pin_files[@]}" \
              | shasum -a 256 \
              | awk '{ print $1 }'
          )"
          if [[ "$promote_digest" != "$VALIDATED_MATERIALIZATION_DIGEST" ]]; then
            echo "Promote materialized a different release diff than validation." >&2
            echo "Validated: $VALIDATED_MATERIALIZATION_DIGEST" >&2
            echo "Promote:   $promote_digest" >&2
            exit 1
          fi

          git add "${pin_files[@]}"

          git commit -F - <<EOF
          🤖 codex: mirror OpenClaw stable source ${{ needs.select.outputs.source_tag }}

          What:
          - update nix-openclaw to the latest stable OpenClaw source release
          - refresh generated config options from that source
          - keep the macOS app pin on the newest public app artifact

          Why:
          - keep the npm-shrinkwrapped OpenClaw gateway current without blocking on public macOS app asset lag

          Tests:
          - nix build .#checks.x86_64-linux.package-artifacts .#checks.x86_64-linux.module-render .#checks.x86_64-linux.runtime-smoke .#checks.x86_64-linux.platform-activation .#checks.x86_64-linux.runtime-plugin-packages .#checks.x86_64-linux.runtime-plugin-host .#checks.x86_64-linux.qmd-opt-in --accept-flake-config
          - nix build --accept-flake-config --option max-jobs 2 .#checks.aarch64-darwin.package-artifacts .#checks.aarch64-darwin.module-render .#checks.aarch64-darwin.runtime-smoke .#checks.aarch64-darwin.platform-activation .#checks.aarch64-darwin.runtime-plugin-packages .#checks.aarch64-darwin.runtime-plugin-host .#checks.aarch64-darwin.qmd-opt-in
          - scripts/hm-activation-macos.sh
          EOF

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          gh workflow run ci.yml --ref main
